<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Letras Hebreo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">OTIOT</h1>
        
        <!-- Letra Grande que aparece -->
        <div id="letterDisplay" class="letter-display hidden">
            <div class="letter-big" id="bigLetter"></div>
        </div>

        <!-- Ruleta -->
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <button id="spinButton" class="spin-button">🔄</button>
        </div>

        <!-- Grid de letras abajo -->
        <div class="letters-grid" id="lettersGrid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
